[workspace]
resolver = "2"
members = ["crates/dropcut-core", "crates/dropcut-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whisper-rs = "0.16"
ureq = "3"

[profile.release]
lto = "thin"
codegen-units = 4
