# Builds the DropCut installers and attaches them to a GitHub release.
#
# Run it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0)
# or from the Actions tab with "Run workflow".
#
# Windows: NSIS .exe installer, speech recognition on the GPU through Vulkan
#          (works on NVIDIA with the normal driver; no CUDA install needed).
# macOS:   .dmg for Apple Silicon, speech recognition on the GPU through Metal.
#          Signed with a Developer ID certificate and notarized by Apple when the
#          APPLE_* repository secrets exist (see docs/macos-signing.md); without
#          them the app is ad-hoc signed and macOS shows its "can't verify" warning.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VULKAN_VERSION: 1.4.304.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            features: vulkan
          - platform: macos-latest
            target: aarch64-apple-darwin
            features: metal
    runs-on: ${{ matrix.platform }}
    env:
      # Windows: whisper.cpp's Vulkan build nests deeply, so use a short
      # target dir to stay under the 260-character path limit. Elsewhere use
      # an absolute path so cargo and tauri-action agree on where output goes.
      CARGO_TARGET_DIR: ${{ matrix.platform == 'windows-latest' && 'C:\t' || format('{0}/target', github.workspace) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR }}"

      # ---------------------------------------------------------- Windows deps
      # Build whisper.cpp with Ninja instead of MSBuild: MSBuild's file tracker
      # can't handle the deep paths of the Vulkan shader generator.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Use Ninja for CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe?Human=true"
          Invoke-WebRequest -Uri $url -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--root","C:\VulkanSDK\$env:VULKAN_VERSION","--accept-licenses","--default-answer","--confirm-command","install"
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem -Path ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe"

      # ---------------------------------------------------------- macOS deps
      - name: Bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          for tool in ffmpeg ffprobe; do
            curl -fsSL -o "$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$tool.zip"
            unzip -o "$tool.zip" -d "dl-$tool"
            cp "dl-$tool/$tool" "src-tauri/binaries/$tool-${{ matrix.target }}"
            chmod +x "src-tauri/binaries/$tool-${{ matrix.target }}"
          done

      - name: Check bundled ffmpeg can burn captions
        shell: bash
        run: |
          bin=$(ls src-tauri/binaries/ffmpeg-*)
          "$bin" -hide_banner -filters | grep -E " subtitles " || { echo "bundled ffmpeg lacks libass"; exit 1; }
          "$bin" -hide_banner -filters | grep -E " zoompan "

      # Signing is optional: only export the Apple variables when every one is
      # present, because Tauri treats an empty APPLE_ID as "notarize" and fails.
      - name: Configure Apple signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$IDENTITY" ] && [ -n "$APPLE_ID_VALUE" ] && [ -n "$APP_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_ID=$APPLE_ID_VALUE"
              echo "APPLE_PASSWORD=$APP_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "DROPCUT_SIGNED=1" >> "$GITHUB_ENV"
            echo "Developer ID signing and notarization enabled."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::Apple signing secrets are not all set; building an unsigned (ad-hoc) app. Mac users will see Gatekeeper's warning. See docs/macos-signing.md."
          fi

      # ---------------------------------------------------------- build
      - run: npm ci

      - name: Test the engine
        run: cargo test -p dropcut-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: DropCut v__VERSION__
          releaseBody: |
            **Windows:** download the `.exe`, run it. If Windows shows "Windows protected your PC", click *More info* then *Run anyway*.
            **Mac (Apple Silicon):** download the `.dmg` and drag DropCut to Applications. If macOS says it "could not verify DropCut is free of malware" (this build was not notarized): open *System Settings > Privacy & Security*, scroll to the DropCut message and click *Open Anyway*. On macOS 14 or earlier you can instead right-click DropCut and choose *Open*.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --features ${{ matrix.features }}

      # If signing was configured, fail the release loudly when the result is
      # not actually signed and notarized, instead of shipping a broken app.
      - name: Verify signature and notarization (macOS)
        if: runner.os == 'macOS' && env.DROPCUT_SIGNED == '1'
        run: |
          app="$CARGO_TARGET_DIR/${{ matrix.target }}/release/bundle/macos/DropCut.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          for tool in ffmpeg ffprobe; do codesign --verify --strict "$app/Contents/MacOS/$tool"; done
